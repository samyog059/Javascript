<html>
    <head>
        <title>
            Input
        </title>
    </head>
    <body>
        <input type="text" id="input"   placeholder="Type something here">
        <p id="op"></p>
        <script>
            const input = document.getElementById("input")
            const output = document.getElementById("op")

            input.addEventListener("input",()=>{
                output.textContent(input.value)
            })
        </script>
    </body>
</html>
