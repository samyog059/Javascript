<html>
    <head>
        <title>
            Counter
        </title>
    </head>
    <body>
        <h2 id="count">0</h2>
        <button id="btn">Increase</button>
        <button id="ghata">Decrease</button>
        <script>
            const countr= document.getElementById("count")
            const btn = document.getElementById("btn")
            const ghata = document.getElementById("ghata")

            let count =0
            btn.addEventListener("click",()=>{
                count=count+1
                countr.textContent= count
            })
            ghata.addEventListener("click",()=>{
                count = count-1
                countr.textContent = count
            })
        </script>
    </body>
</html>
