<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== Basic Reset & Font ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }

        /* ===== Container Styling ===== */
        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 10px;
        }

        h2:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            border-radius: 2px;
        }

        /* ===== Input and Add Button ===== */
        .input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e1e5f2;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            background-color: #f8f9ff;
            transition: all 0.3s;
        }

        #taskInput:focus {
            border-color: #6a11cb;
            box-shadow: 0 0 0 3px rgba(106,17,203,0.1);
        }

        #taskInput::placeholder {
            color: #aaa;
        }

        #addBtn {
            padding: 0 20px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.3s;
        }

        #addBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(106,17,203,0.4);
        }

        /* ===== Task List ===== */
        #taskList {
            list-style-type: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        #taskList li {
            background-color: white;
            margin-bottom: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
            border-left: 5px solid #6a11cb;
            animation: slideIn 0.3s ease-out;
            transition: all 0.3s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #taskList li:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.12);
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
        }

        .delete-btn {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(255,65,108,0.3);
        }

        #msg {
            text-align: center;
            margin-top: 15px;
            min-height: 24px;
            font-weight: 500;
        }

        .task-counter {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
            border-left-color: #4CAF50 !important;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            .input-container { flex-direction: column; }
            #addBtn { width: 100%; padding: 14px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-tasks"></i> My To-Do List</h2>

        <!-- Input & Add Button -->
        <div class="input-container">
            <input id="taskInput" placeholder="Enter a new task...">
            <button id="addBtn"><i class="fas fa-plus"></i> Add Task</button>
        </div>

        <!-- Task List & Empty State -->
        <div id="taskContainer">
            <ul id="taskList"></ul>
            <div id="emptyState" class="empty-state">
                <i class="far fa-clipboard"></i>
                <p>No tasks yet. Add a task to get started!</p>
            </div>
        </div>

        <!-- Task Counter -->
        <div class="task-counter">
            Tasks: <span id="taskCount">0</span>
        </div>

        <!-- Message -->
        <p id="msg"></p>
    </div>

    <script>
        // ===== Select DOM elements =====
        const taskInput = document.getElementById("taskInput");
        const addBtn = document.getElementById("addBtn");
        const taskList = document.getElementById("taskList");
        const emptyState = document.getElementById("emptyState");
        const taskCount = document.getElementById("taskCount");
        const msg = document.getElementById("msg");

        // ===== Disable Add button initially =====
        addBtn.disabled = true;

        // ===== Enable Add button only if input is not empty =====
        taskInput.addEventListener("input", () => {
            addBtn.disabled = taskInput.value.trim() === "";
        });

        // ===== Add Task function =====
        function addTask() {
            const value = taskInput.value.trim();

            // Validation
            if (value === "") {
                showMessage("Task cannot be empty!", "error");
                taskInput.focus();
                return;
            }

            // Hide empty state if tasks exist
            if (emptyState.style.display !== "none") {
                emptyState.style.display = "none";
            }

            // Create task item
            const li = document.createElement("li");

            // Task text span
            const taskText = document.createElement("span");
            taskText.className = "task-text";
            taskText.textContent = value;

            // Click to toggle complete
            taskText.addEventListener("click", () => {
                li.classList.toggle("completed");
            });

            // Delete button
            const delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.innerHTML = '<i class="fas fa-trash"></i>';

            li.appendChild(taskText);
            li.appendChild(delBtn);
            taskList.appendChild(li);

            // Clear input
            taskInput.value = "";
            addBtn.disabled = true;

            showMessage("Task added successfully!", "success");
            updateTaskCounter();
        }

        // ===== Add task on button click =====
        addBtn.addEventListener("click", addTask);

        // ===== Add task on Enter key press =====
        taskInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") addTask();
        });

        // ===== Delete Task using Event Delegation =====
        taskList.addEventListener("click", (e) => {
            if (e.target.closest(".delete-btn")) {
                const li = e.target.closest("li");
                li.remove(); // Remove task
                updateTaskCounter();

                // Show empty state if no tasks
                if (taskList.children.length === 0) {
                    emptyState.style.display = "block";
                }

                showMessage("Task deleted.", "info");
            }
        });

        // ===== Show message function =====
        function showMessage(message, type) {
            msg.textContent = message;
            msg.style.color = type === "error" ? "#ff416c" :
                              type === "success" ? "#4CAF50" : "#2575fc";

            setTimeout(() => {
                msg.textContent = "";
            }, 3000);
        }

        // ===== Update task counter =====
        function updateTaskCounter() {
            taskCount.textContent = taskList.children.length;
        }
    </script>
</body>
</html>
